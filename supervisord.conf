[supervisord]
nodaemon=true ; Запускает Supervisor на переднем плане, что нужно для Docker

[program:backend-api]
command=uvicorn src.create_app:create_app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/backend-api-err.log
stdout_logfile=/var/log/supervisor/backend-api-out.log

[program:tg-bot]
command=python -m src.tg_bot.bot
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/tg-bot-err.log
stdout_logfile=/var/log/supervisor/tg-bot-out.log